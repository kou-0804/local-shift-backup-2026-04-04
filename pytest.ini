# pytest.ini
[pytest]
# archive/ is a backup dump (its own main.py + diagnostic test scripts) — never collect it,
# or it shadows the real root main.py on sys.path and breaks `from main import run_schedule`.
# .claude/ holds agent git worktrees (each a full repo copy); collecting them duplicates
# every test module and triggers pytest "import file mismatch" collection errors.
norecursedirs = archive .claude .venv
markers =
    slow: end-to-end tests that run the real CP-SAT solver (minutes)
